name: CI

# Typecheck + production build on every push / PR to main, so a broken build
# can never silently reach production. Set this as a required check in
# GitHub → Settings → Branches → Branch protection to block bad merges.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Report-only for now: the repo has pre-existing lint debt across ~20
        # files. This surfaces issues (and any NEW ones) in the CI logs without
        # blocking merges. Flip to blocking (remove continue-on-error) once the
        # existing debt is cleared.
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npx next build
